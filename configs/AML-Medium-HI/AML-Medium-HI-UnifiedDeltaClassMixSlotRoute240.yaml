out_dir: /e/yyk/FraudGT_multi6/unified_supportmixconsisdeltafusionclassmixslotrouteboundresid_full240_main
metric_best: f1
seed: 42
wandb:
  use: False
dataset:
  dir: /e/yyk/data/archive
  format: AML
  name: Medium-HI
  add_ports: True
  task: hetero_edge
  task_type: classification
  task_entity: ('node', 'to', 'node')
  transductive: True
  node_encoder: True
  node_encoder_name: Hetero_Raw
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Hetero_Raw
  edge_encoder_bn: False
num_threads: 24
num_workers: 8
train:
  mode: custom
  sampler: link_neighbor
  neighbor_sizes: [50, 50]
  add_ego_id: True
  iter_per_epoch: 256
  batch_size: 1024
  eval_period: 2
  ckpt_period: 50
  tqdm: True
  persistent_workers: True
  pin_memory: True
val:
  sampler: link_neighbor
  iter_per_epoch: 256
  tqdm: True
model:
  type: GTModel
  loss_fun: weighted_cross_entropy
  loss_fun_weight: [1, 6]
  edge_decoding: pair_chain_contextseqpairseqbridgebankwindowseqselectdeltafusionroleflowboundarylagsupportmixconsisclassmixslotrouteboundresid
  graph_pooling: mean
  auto_tune_thresh: True
gt:
  layer_type: SparseNodeTransformer
  layers_pre_gt: 0
  layers: 2
  layers_post_gt: 2
  attn_heads: 8
  dim_hidden: 64
  input_dropout: 0.0
  dropout: 0.2
  attn_dropout: 0.3
  batch_norm: False
  layer_norm: True
  l2_norm: False
  act: gelu
  attn_mask: Edge
  residual: Fixed
  ffn: Type
  jumping_knowledge: False
  temporal_bias: none
  temporal_gate: False
  edge_writeback: dir_meanmaxwinnerprojtemporal
  edge_writeback_dropout: 0.1
gnn:
  dropout: 0.2
optim:
  batch_accumulation: 16
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 0.001
  max_epoch: 240
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5
